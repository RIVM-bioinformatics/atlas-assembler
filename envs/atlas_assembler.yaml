name: atlas_assembler
channels:
  - conda-forge
  - bioconda
  - biocore
  - nodefaults
dependencies:
  - git=2.40.*
  - mamba=1.3.*
  - pandas=1.5.*
  - snakemake=7.18.*
  - pip=23.*
  - python=3.11.*
  - yaml
  - seqiolib
  - tabulate=0.8.9
  # - conda=24.5.0 # added this because it seems to crash on later version
  # - libmamba=1.5.8 
  # - mamba=1.5.8 #0.21.2 / conda 4.11.0 # seems to be unable to install snakemake envs with v2.0.5
  - pigz #2.6
  - pymssql

  - pip:
    - "--editable=git+https://github.com/RIVM-bioinformatics/juno-library.git@nanopore_integration#egg=juno-library"
    - pyyaml
    - biopython
    - termcolor
    - python-irodsclient